# Release config. The archive and checksum names are a contract with
# rhythm/kit/update and the install script: <binary>_<os>_<arch>.tar.gz
# (.zip on Windows) plus checksums.txt.
version: 2
project_name: rhythm

builds:
  - main: ./cmd/rhythm
    binary: rhythm
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE*]

# One SPDX JSON SBOM per archive, written by syft (release-go installs a
# pinned version), named <archive>.sbom.json. GoReleaser lists SBOMs in
# checksums.txt, so the signature over it covers them too.
sboms:
  - artifacts: archive
    documents: ["{{ .ArtifactName }}.sbom.json"]
    cmd: syft
    args: ["$artifact", "--output", "spdx-json=$document"]

# Linux packages: the binary in /usr/bin, with the license and README.
# GoReleaser lists them in checksums.txt, so the signature covers them.
nfpms:
  - package_name: rhythm
    file_name_template: "{{ .ConventionalFileName }}"
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    vendor: Rhythm Shahriar
    maintainer: Rhythm Shahriar <me@rhy.io>
    homepage: https://github.com/RhythmShahriar/rhythm
    description: Installs, updates and runs the Rhythm developer tools.
    license: AGPL-3.0-only
    section: utils
    contents:
      - src: LICENSE
        dst: /usr/share/doc/rhythm/LICENSE
        file_info: {mode: 0o644}
      - src: README.md
        dst: /usr/share/doc/rhythm/README.md
        file_info: {mode: 0o644}

# Package-manager manifests. They push to repositories the owner has yet
# to create (RhythmShahriar/homebrew-tap, RhythmShahriar/scoop-bucket and a
# fork of microsoft/winget-pkgs) with the TAP_GITHUB_TOKEN secret. Without
# that secret each one is generated into dist/ and not uploaded, so
# releases keep working; with it, prereleases are still skipped ("auto").
# The manifests point at the same archives and sha256 sums as
# checksums.txt.
homebrew_casks:
  - name: rhythm
    binaries: [rhythm]
    directory: Casks
    homepage: https://github.com/RhythmShahriar/rhythm
    description: Installs, updates and runs the Rhythm developer tools
    license: AGPL-3.0-only
    commit_msg_template: "chore: rhythm {{ .Tag }}"
    repository:
      owner: RhythmShahriar
      name: homebrew-tap
      token: '{{ index .Env "TAP_GITHUB_TOKEN" }}'
    skip_upload: '{{ if not (index .Env "TAP_GITHUB_TOKEN") }}true{{ else }}auto{{ end }}'
    # The binaries are not notarized; without this macOS refuses to run one
    # downloaded by Homebrew.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/rhythm"]
          end

scoops:
  - name: rhythm
    directory: bucket
    homepage: https://github.com/RhythmShahriar/rhythm
    description: Installs, updates and runs the Rhythm developer tools.
    license: AGPL-3.0-only
    commit_msg_template: "chore: rhythm {{ .Tag }}"
    repository:
      owner: RhythmShahriar
      name: scoop-bucket
      token: '{{ index .Env "TAP_GITHUB_TOKEN" }}'
    skip_upload: '{{ if not (index .Env "TAP_GITHUB_TOKEN") }}true{{ else }}auto{{ end }}'

# winget: the manifest goes to a branch of RhythmShahriar/winget-pkgs (a
# fork) and GoReleaser opens a pull request against microsoft/winget-pkgs.
winget:
  - name: rhythm
    package_identifier: RhythmShahriar.rhythm
    publisher: Rhythm Shahriar
    publisher_url: https://github.com/RhythmShahriar
    publisher_support_url: https://github.com/RhythmShahriar/rhythm/issues
    author: Rhythm Shahriar
    homepage: https://github.com/RhythmShahriar/rhythm
    short_description: Installs, updates and runs the Rhythm developer tools.
    license: AGPL-3.0-only
    license_url: https://github.com/RhythmShahriar/rhythm/blob/master/LICENSE
    release_notes_url: https://github.com/RhythmShahriar/rhythm/releases/tag/{{ .Tag }}
    tags: [cli, developer-tools, security]
    commit_msg_template: "New version: RhythmShahriar.rhythm {{ .Version }}"
    repository:
      owner: RhythmShahriar
      name: winget-pkgs
      branch: "rhythm-{{ .Version }}"
      token: '{{ index .Env "TAP_GITHUB_TOKEN" }}'
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
    skip_upload: '{{ if not (index .Env "TAP_GITHUB_TOKEN") }}true{{ else }}auto{{ end }}'

checksum:
  name_template: checksums.txt

# A tag like v0.4.0-rc1 is published as a prerelease, which GitHub never
# reports as "latest", so rhythm update and the installers don't offer it.
release:
  prerelease: auto

# Keyless Sigstore signature over checksums.txt. Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity https://github.com/RhythmShahriar/.github/.github/workflows/release-go.yml@refs/heads/master \
#     --certificate-github-workflow-repository RhythmShahriar/rhythm \
#     --certificate-github-workflow-ref refs/tags/v<version> \
#     checksums.txt
# The identity names the shared reusable workflow, which any public
# repository can call, so it alone proves nothing about who released.
# The repository and tag flags pin the caller: this repository at this
# release's tag. Then check each archive against checksums.txt
# (sha256sum --ignore-missing -c checksums.txt).
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", "${artifact}", --yes]

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude: ['^(docs|test|ci|chore|style)(\(.+\))?!?:']
