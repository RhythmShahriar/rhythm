# Runs the setup-rhythm action (setup/) on Linux, macOS and Windows
# against a fake release API on 127.0.0.1, so nothing reaches GitHub's
# releases. The rhythm it installs is the stand-in from scripts/test/stub
# that the installer tests use. It checks that the tools land on PATH,
# that the tools step leaves out rhythm's note that the folder isn't on
# PATH yet, that a second job restores the download cache, that a version
# rhythm.lock doesn't pin fails the step and that skip-signature is read
# the same way on every runner, a bad value failing before anything is
# installed.
name: setup-rhythm

on:
  push:
    branches: [master]
    paths: [setup/**, scripts/**, .github/workflows/setup-rhythm-test.yml]
  pull_request:
    paths: [setup/**, scripts/**, .github/workflows/setup-rhythm-test.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  RHYTHM_GITHUB_API: http://127.0.0.1:23000
  GOWORK: "off"

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Start the fake release API
        shell: bash
        run: bash setup/test/start-fake-api.sh
      - id: setup
        uses: ./setup
        with:
          tools: tuner@0.3.2 soundcheck
          version: 0.7.0
          token: "" # the fake API is no place for a token; gh stays logged out
      - name: Check the tools are on PATH and the outputs
        shell: bash
        env:
          RHYTHM_VERSION_OUT: ${{ steps.setup.outputs.rhythm-version }}
          TOOLS_OUT: ${{ steps.setup.outputs.tool-versions }}
          CACHE_DIR: ${{ steps.setup.outputs.cache-dir }}
        run: |
          set -eu
          command -v rhythm
          command -v rhythm-tuner
          command -v rhythm-soundcheck
          rhythm --version
          [ "$RHYTHM_VERSION_OUT" = 0.7.0 ] || { echo "rhythm-version is '$RHYTHM_VERSION_OUT'"; exit 1; }
          [ "$TOOLS_OUT" = "tuner@0.3.2 soundcheck@0.0.0-test" ] || { echo "tool-versions is '$TOOLS_OUT'"; exit 1; }
          # The stand-in caches nothing, so leave a file for the next job to find.
          mkdir -p "$CACHE_DIR"
          echo "${{ github.run_id }}" >"$CACHE_DIR/marker"
      - name: Check the tools step leaves out rhythm's PATH note
        shell: bash
        env:
          INSTALL_DIR: ${{ steps.setup.outputs.install-dir }}
        run: |
          set -eu
          # A folder that isn't on PATH, with the stand-in rhythm in it.
          exe=
          [ "$RUNNER_OS" != Windows ] || exe=.exe
          dir=$RUNNER_TEMP/pathnote
          mkdir -p "$dir"
          cp "$INSTALL_DIR/rhythm$exe" "$dir/"
          # rhythm itself says the folder isn't on PATH...
          "$dir/rhythm$exe" install echo --dir "$dir" | grep "isn't on your PATH"
          rm -f "$dir/rhythm-echo$exe"
          # ...and the step, which adds it to PATH for the next steps, leaves that out.
          out=$(INPUT_TOOLS=echo INPUT_INSTALL_DIR="$dir" GITHUB_PATH="$RUNNER_TEMP/pathnote.path" \
            GITHUB_OUTPUT="$RUNNER_TEMP/pathnote.out" bash setup/setup.sh tools 2>&1)
          printf '%s\n' "$out"
          case $out in
          *"isn't on your PATH"*) echo "the tools step printed rhythm's PATH note"; exit 1 ;;
          esac
          case $out in
          *"Installed rhythm-echo "*) ;;
          *) echo "the tools step lost the Installed line"; exit 1 ;;
          esac
          grep -qx 'tool-versions=echo@0.0.0-test' "$RUNNER_TEMP/pathnote.out" || { cat "$RUNNER_TEMP/pathnote.out"; exit 1; }

  cached:
    needs: install
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Start the fake release API
        shell: bash
        run: bash setup/test/start-fake-api.sh
      - id: setup
        uses: ./setup
        with:
          tools: tuner@0.3.2 soundcheck
          version: 0.7.0
          token: ""
      - name: Check the download cache was restored
        shell: bash
        env:
          HIT: ${{ steps.setup.outputs.cache-hit }}
          CACHE_DIR: ${{ steps.setup.outputs.cache-dir }}
        run: |
          set -eu
          [ "$HIT" = true ] || { echo "cache-hit is '$HIT'"; exit 1; }
          [ "$(cat "$CACHE_DIR/marker")" = "${{ github.run_id }}" ] || { echo "the cached marker is missing"; exit 1; }

  locked:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Start the fake release API and write a lock
        shell: bash
        run: |
          bash setup/test/start-fake-api.sh
          mkdir -p "$RUNNER_TEMP/project"
          printf '%s\n' '{"schema":"rhythm-lock/v1","tools":[{"name":"tuner","version":"0.3.1"}]}' >"$RUNNER_TEMP/project/rhythm.lock"
      - id: match
        uses: ./setup
        with:
          tools: tuner@0.3.1
          version: 0.7.0
          locked: true
          token: ""
          working-directory: ${{ runner.temp }}/project
      - id: mismatch
        continue-on-error: true
        uses: ./setup
        with:
          tools: tuner@0.3.2
          version: 0.7.0
          locked: true
          token: ""
          working-directory: ${{ runner.temp }}/project
      - name: Check a version the lock doesn't pin failed
        shell: bash
        env:
          MATCH: ${{ steps.match.outputs.tool-versions }}
          OUTCOME: ${{ steps.mismatch.outcome }}
        run: |
          set -eu
          [ "$MATCH" = tuner@0.3.1 ] || { echo "locked tool-versions is '$MATCH'"; exit 1; }
          [ "$OUTCOME" = failure ] || { echo "a locked mismatch ended in '$OUTCOME'"; exit 1; }

  inputs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Start the fake release API and log the stand-in's calls
        shell: bash
        run: |
          bash setup/test/start-fake-api.sh
          # The stand-in rhythm appends its argv here.
          echo "RHYTHM_TEST_LOG=$RUNNER_TEMP/rhythm.log" >>"$GITHUB_ENV"
      - id: bad-skip
        continue-on-error: true
        uses: ./setup
        with:
          tools: tuner
          version: 0.7.0
          skip-signature: maybe
          token: ""
          install-dir: ${{ runner.temp }}/bad
      - id: bad-locked
        continue-on-error: true
        uses: ./setup
        with:
          tools: tuner
          version: 0.7.0
          locked: sometimes
          token: ""
          install-dir: ${{ runner.temp }}/bad
      - name: Check bad values failed before anything was installed
        shell: bash
        env:
          SKIP: ${{ steps.bad-skip.outcome }}
          LOCKED: ${{ steps.bad-locked.outcome }}
        run: |
          set -eu
          [ "$SKIP" = failure ] || { echo "skip-signature: maybe ended in '$SKIP'"; exit 1; }
          [ "$LOCKED" = failure ] || { echo "locked: sometimes ended in '$LOCKED'"; exit 1; }
          if [ -e "$RUNNER_TEMP/bad" ]; then
            ls -la "$RUNNER_TEMP/bad"
            echo "a bad input still installed something"
            exit 1
          fi
          if [ -s "$RHYTHM_TEST_LOG" ]; then
            cat "$RHYTHM_TEST_LOG"
            echo "a bad input still ran rhythm"
            exit 1
          fi
      # "Yes" is true under setup.sh's rule; the Windows installer step
      # must see it the same way.
      - id: skip
        uses: ./setup
        with:
          tools: tuner
          version: 0.7.0
          skip-signature: "Yes"
          token: ""
          install-dir: ${{ runner.temp }}/skip
      - name: Check the signature checks were skipped
        shell: bash
        run: |
          set -eu
          cat "$RHYTHM_TEST_LOG"
          grep -q -- '^rhythm install .*--skip-signature' "$RHYTHM_TEST_LOG" || { echo "rhythm install wasn't given --skip-signature"; exit 1; }
          if grep -q '^rhythm verify' "$RHYTHM_TEST_LOG"; then
            echo "the installer checked rhythm's signature although skip-signature is Yes"
            exit 1
          fi
          : >"$RHYTHM_TEST_LOG"
      - id: checked
        uses: ./setup
        with:
          tools: tuner
          version: 0.7.0
          skip-signature: "no"
          token: ""
          install-dir: ${{ runner.temp }}/checked
      - name: Check the signature checks ran
        shell: bash
        run: |
          set -eu
          cat "$RHYTHM_TEST_LOG"
          grep -q '^rhythm verify rhythm' "$RHYTHM_TEST_LOG" || { echo "the installer didn't run rhythm verify rhythm"; exit 1; }
          if grep -q -- '--skip-signature' "$RHYTHM_TEST_LOG"; then
            echo "skip-signature: no still skipped the checks"
            exit 1
          fi
